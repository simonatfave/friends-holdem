      <text x="-3" y="-14" text-anchor="middle" font-size="20" font-weight="700" fill="#cdd8e4">케빈 봇</text>
      <text x="-3" y="14" text-anchor="middle" font-size="20" font-weight="800" fill="#e8c466">● 4,120</text>
      <rect x="-58" y="32" width="50" height="66" rx="7" fill="url(#cardback)"/><rect x="8" y="32" width="50" height="66" rx="7" fill="url(#cardback)"/>
