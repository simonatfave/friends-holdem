    <line x1="-120" y1="40" x2="120" y2="40" stroke="#e8c466" stroke-dasharray="4 6" opacity="0.6"/>
    <g transform="translate(-128,56)" filter="url(#cs)"><rect width="118" height="118" rx="13" fill="url(#cardg)"/><text x="14" y="42" font-size="38" font-weight="800" fill="#111">A</text><text x="14" y="74" font-size="26" fill="#111">♠</text><text x="59" y="94" font-size="56" text-anchor="middle" fill="#111">♠</text></g>
    <g transform="translate(10,56)" filter="url(#cs)"><rect width="118" height="118" rx="13" fill="url(#cardg)"/><text x="14" y="42" font-size="38" font-weight="800" fill="#c0392b">A</text><text x="14" y="74" font-size="26" fill="#c0392b">♥</text><text x="59" y="94" font-size="56" text-anchor="middle" fill="#c0392b">♥</text></g>
  </g>
  <g transform="translate(380,1196)">
    <rect x="-110" y="-22" width="220" height="44" rx="22" fill="#0e1622" stroke="#e8c466"/>
    <text x="0" y="9" text-anchor="middle" font-size="22" font-weight="800" fill="#e8c466">내 패 · 원 페어 (AA)</text>
