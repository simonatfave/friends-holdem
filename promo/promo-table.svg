    <g transform="translate(-205,-60)"><g filter="url(#cs)"><rect width="78" height="112" rx="11" fill="url(#cardg)"/><text x="11" y="34" font-size="28" font-weight="800" fill="#c0392b">A</text><text x="11" y="58" font-size="20" fill="#c0392b">♥</text><text x="39" y="78" font-size="48" text-anchor="middle" fill="#c0392b">♥</text></g></g>
    <g transform="translate(-122,-60)"><g filter="url(#cs)"><rect width="78" height="112" rx="11" fill="url(#cardg)"/><text x="11" y="34" font-size="28" font-weight="800" fill="#111">K</text><text x="11" y="58" font-size="20" fill="#111">♠</text><text x="39" y="78" font-size="48" text-anchor="middle" fill="#111">♠</text></g></g>
    <g transform="translate(-39,-60)"><g filter="url(#cs)"><rect width="78" height="112" rx="11" fill="url(#cardg)"/><text x="11" y="34" font-size="28" font-weight="800" fill="#c0392b">Q</text><text x="11" y="58" font-size="20" fill="#c0392b">♦</text><text x="39" y="78" font-size="48" text-anchor="middle" fill="#c0392b">♦</text></g></g>
    <g transform="translate(44,-60)"><g filter="url(#cs)"><rect width="78" height="112" rx="11" fill="url(#cardg)"/><text x="11" y="34" font-size="28" font-weight="800" fill="#111">J</text><text x="11" y="58" font-size="20" fill="#111">♣</text><text x="39" y="78" font-size="48" text-anchor="middle" fill="#111">♣</text></g></g>
    <g transform="translate(127,-60)"><g filter="url(#cs)"><rect width="78" height="112" rx="11" fill="url(#cardg)"/><text x="8" y="34" font-size="26" font-weight="800" fill="#111">10</text><text x="11" y="58" font-size="20" fill="#111">♠</text><text x="39" y="78" font-size="48" text-anchor="middle" fill="#111">♠</text></g></g>
  </g>

  <!-- monster pot + pot -->
  <g transform="translate(380,760)">
    <rect x="-160" y="-26" width="320" height="52" rx="26" fill="#b3271c" stroke="#ffd877" stroke-width="2"/>
    <circle cx="-128" cy="0" r="13" fill="#ffd877"/><text x="-128" y="6" text-anchor="middle" font-size="16" font-weight="900" fill="#7a1f16">$</text>
    <text x="14" y="9" text-anchor="middle" font-size="26" font-weight="900" fill="#ffe9a8">MONSTER POT</text>
    <text x="0" y="62" text-anchor="middle" font-size="26" font-weight="800" fill="#e8c466">팟: 6,400</text>
  </g>

  <!-- my seat -->
  <g transform="translate(380,980)">
    <rect x="-150" y="-44" width="300" height="232" rx="18" fill="#0e1622" stroke="#41d18b" stroke-width="3"/>
    <circle cx="-96" cy="-22" r="14" fill="#c9a23c"/><text x="-96" y="-16" text-anchor="middle" font-size="16" font-weight="800" fill="#1a140a">S</text>
