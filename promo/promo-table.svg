  <!-- action buttons -->
  <g transform="translate(0,1268)" font-weight="800">
    <g font-size="20">
      <g transform="translate(40,0)"><rect width="118" height="64" rx="14" fill="#1a3340" stroke="#2f6f8f"/><text x="59" y="28" text-anchor="middle" fill="#7fd0e8">½팟</text><text x="59" y="52" text-anchor="middle" fill="#7fd0e8">3,200</text></g>
      <g transform="translate(170,0)"><rect width="118" height="64" rx="14" fill="#26244a" stroke="#5b58a8"/><text x="59" y="28" text-anchor="middle" fill="#b0aef0" font-size="18">2/3팟</text><text x="59" y="52" text-anchor="middle" fill="#b0aef0">4,260</text></g>
      <g transform="translate(300,0)"><rect width="118" height="64" rx="14" fill="#42361a" stroke="#9a7d34"/><text x="59" y="28" text-anchor="middle" fill="#e8c466">팟</text><text x="59" y="52" text-anchor="middle" fill="#e8c466">6,400</text></g>
      <g transform="translate(430,0)"><rect width="118" height="64" rx="14" fill="#4f201d" stroke="#a84038"/><text x="59" y="28" text-anchor="middle" fill="#ff9a90">올인</text><text x="59" y="52" text-anchor="middle" fill="#ff9a90">5,200</text></g>
      <circle cx="690" cy="32" r="30" fill="#1b2330" stroke="#e8c466"/><g stroke="#e8c466" stroke-width="2.4" fill="none"><circle cx="690" cy="34" r="11"/><path d="M690,34 v-6 M690,34 l5,3"/></g>
    </g>
    <g transform="translate(0,84)" font-size="26">
      <g transform="translate(40,0)"><rect width="190" height="78" rx="18" fill="#3a4554"/><text x="95" y="50" text-anchor="middle" fill="#dfe7f0">폴드</text></g>
      <g transform="translate(250,0)"><rect width="220" height="78" rx="18" fill="url(#green)"/><text x="110" y="50" text-anchor="middle" fill="#0c2a1c">콜 800</text></g>
      <g transform="translate(490,0)"><rect width="230" height="78" rx="18" fill="url(#gold)"/><text x="115" y="50" text-anchor="middle" fill="#3a2c08">레이즈 1,600</text></g>
