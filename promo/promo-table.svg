<svg width="760" height="1500" viewBox="0 0 760 1500" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans CJK KR',-apple-system,'Segoe UI',sans-serif">
  <defs>
    <linearGradient id="appbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f1722"/><stop offset="100%" stop-color="#0a0d12"/></linearGradient>
    <radialGradient id="felt" cx="50%" cy="42%" r="62%"><stop offset="0%" stop-color="#2a8a59"/><stop offset="70%" stop-color="#1c6f47"/><stop offset="100%" stop-color="#0f3f29"/></radialGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7a4d28"/><stop offset="100%" stop-color="#4d3019"/></linearGradient>
    <linearGradient id="cardg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#eef1f4"/></linearGradient>
    <linearGradient id="cardback" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3b6fb0"/><stop offset="100%" stop-color="#274d82"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f4d77e"/><stop offset="100%" stop-color="#d4a93f"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#5fe0a3"/><stop offset="100%" stop-color="#33b97e"/></linearGradient>
    <filter id="cs" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>

  <rect width="760" height="1500" fill="url(#appbg)"/>

  <!-- top bar -->
  <g font-size="22" font-weight="700">
    <rect x="24" y="30" width="120" height="48" rx="24" fill="#141b25" stroke="#2a3340"/>
    <text x="84" y="61" text-anchor="middle" fill="#9fb0c2">핸드 #14</text>
    <rect x="156" y="30" width="186" height="48" rx="24" fill="#141b25" stroke="#2a3340"/>
    <text x="249" y="61" text-anchor="middle" fill="#9fb0c2">블라인드 100/200</text>
    <g fill="#1b2330" stroke="#2a3340"><circle cx="560" cy="54" r="24"/><circle cx="616" cy="54" r="24"/><circle cx="672" cy="54" r="24"/><circle cx="728" cy="54" r="24"/></g>
    <!-- drawn icons -->
    <g stroke="#9fb0c2" stroke-width="2.4" fill="none">
      <path d="M553,50 a7,7 0 0 1 14,0 v4 l2,3 h-18 l2,-3 z"/><path d="M557,60 a3,3 0 0 0 6,0" stroke-width="2"/>
      <circle cx="616" cy="54" r="7"/><circle cx="616" cy="54" r="2" fill="#9fb0c2"/>
      <rect x="664" y="47" width="16" height="11" rx="4"/><path d="M669,58 l0,4 l5,-4" fill="none"/>
      <rect x="722" y="46" width="12" height="16" rx="2"/><path d="M728,54 h6 m-3,-3 l3,3 l-3,3" stroke-width="2"/>
    </g>
  </g>

  <!-- table -->
  <ellipse cx="380" cy="700" rx="338" ry="520" fill="url(#rail)"/>
  <ellipse cx="380" cy="700" rx="312" ry="494" fill="url(#felt)"/>
  <text x="380" y="745" text-anchor="middle" font-size="120" font-weight="800" fill="#0e3a26" opacity="0.55" letter-spacing="10">DICE</text>

  <!-- opponents -->
  <g>
    <g transform="translate(214,250)">
      <rect x="-78" y="-44" width="156" height="150" rx="14" fill="#101822" stroke="#2a3340" opacity="0.92"/>
      <text x="0" y="-14" text-anchor="middle" font-size="20" font-weight="700" fill="#cdd8e4">데이빗 봇</text>
      <text x="0" y="14" text-anchor="middle" font-size="20" font-weight="800" fill="#e8c466">● 3,180</text>
      <rect x="-58" y="32" width="50" height="66" rx="7" fill="url(#cardback)"/><rect x="8" y="32" width="50" height="66" rx="7" fill="url(#cardback)"/>
    </g>
    <g transform="translate(546,250)">
      <rect x="-78" y="-44" width="156" height="150" rx="14" fill="#101822" stroke="#2a3340" opacity="0.92"/>
      <text x="0" y="-14" text-anchor="middle" font-size="20" font-weight="700" fill="#cdd8e4">헨리 봇</text>
      <text x="0" y="14" text-anchor="middle" font-size="20" font-weight="800" fill="#e8c466">● 5,040</text>
      <rect x="-58" y="32" width="50" height="66" rx="7" fill="url(#cardback)"/><rect x="8" y="32" width="50" height="66" rx="7" fill="url(#cardback)"/>
      <circle cx="64" cy="-44" r="16" fill="#fff"/><text x="64" y="-38" text-anchor="middle" font-size="18" font-weight="800" fill="#111">D</text>
    </g>
    <g transform="translate(120,520)">
      <rect x="-72" y="-44" width="150" height="150" rx="14" fill="#101822" stroke="#2a3340" opacity="0.92"/>
      <text x="3" y="-14" text-anchor="middle" font-size="20" font-weight="700" fill="#cdd8e4">조던 봇</text>
      <text x="3" y="14" text-anchor="middle" font-size="20" font-weight="800" fill="#e8c466">● 2,600</text>
      <rect x="-52" y="32" width="50" height="66" rx="7" fill="url(#cardback)"/><rect x="14" y="32" width="50" height="66" rx="7" fill="url(#cardback)"/>
    </g>
    <g transform="translate(640,520)">
