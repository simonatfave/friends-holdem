<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🎲 Dice — 친구들과 포커</title>
  <meta name="theme-color" content="#0e1219" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dice" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="style.css?v=30" />
</head>
<body>
  <!-- 입장 비밀번호 게이트 -->
  <div id="gate" class="screen">
    <div class="lobby-card">
      <div class="brand-logo">
        <svg viewBox="0 0 340 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DICE">
          <rect x="6" y="14" width="68" height="68" rx="16" fill="#e8c466"/>
          <circle cx="26" cy="34" r="6.5" fill="#14181f"/>
          <circle cx="54" cy="34" r="6.5" fill="#14181f"/>
          <circle cx="40" cy="48" r="6.5" fill="#14181f"/>
          <circle cx="26" cy="62" r="6.5" fill="#14181f"/>
          <circle cx="54" cy="62" r="6.5" fill="#14181f"/>
          <text x="92" y="67" font-family="-apple-system,Segoe UI,sans-serif" font-size="58" font-weight="800" fill="#e8c466" letter-spacing="3">DICE</text>
        </svg>
      </div>
      <p class="sub">입장하려면 비밀번호를 입력하세요</p>
      <input id="gatePw" type="password" inputmode="numeric" autocomplete="off" placeholder="비밀번호" maxlength="16" />
      <button id="gateBtn" class="primary">입장</button>
      <p id="gateError" class="error"></p>
    </div>
  </div>

  <!-- 로비 화면 -->
  <div id="lobby" class="screen hidden">
    <div class="lobby-card">
      <div class="brand-logo">
        <svg viewBox="0 0 340 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DICE">
          <rect x="6" y="14" width="68" height="68" rx="16" fill="#e8c466"/>
          <circle cx="26" cy="34" r="6.5" fill="#14181f"/>
          <circle cx="54" cy="34" r="6.5" fill="#14181f"/>
          <circle cx="40" cy="48" r="6.5" fill="#14181f"/>
          <circle cx="26" cy="62" r="6.5" fill="#14181f"/>
          <circle cx="54" cy="62" r="6.5" fill="#14181f"/>
          <text x="92" y="67" font-family="-apple-system,Segoe UI,sans-serif" font-size="58" font-weight="800" fill="#e8c466" letter-spacing="3">DICE</text>
        </svg>
      </div>
      <p class="sub">친구들과 즐기는 실시간 텍사스 홀덤 · 토너먼트</p>

      <label>닉네임</label>
      <input id="nameInput" maxlength="16" placeholder="이름을 입력하세요" />

      <div class="tabs">
        <button class="tab active" data-tab="create">방 만들기</button>
        <button class="tab" data-tab="join">방 참여</button>
        <button class="tab" data-tab="rooms">방 목록</button>
      </div>

      <div id="createPane" class="pane">
        <div class="row">
          <div>
            <label>시작 블라인드(BB)</label>
            <input id="startBB" type="number" value="2" min="2" max="100" step="1" />
          </div>
          <div>
            <label>블라인드 상승(분)</label>
            <input id="levelMinutes" type="number" value="3" min="1" max="60" />
          </div>
        </div>
        <label>턴 제한시간(초, 0=무제한)</label>
        <input id="actionSeconds" type="number" value="25" min="0" max="120" />
        <p class="stack-info">시작 칩 ⚫20 · 🔴20 · 🟢20 <b>= 320</b></p>
        <button id="createBtn" class="primary">방 만들기</button>
      </div>

      <div id="joinPane" class="pane hidden">
        <label>방 코드</label>
        <input id="codeInput" maxlength="4" placeholder="ABCD" style="text-transform:uppercase" />
        <button id="joinBtn" class="primary">참여하기</button>
      </div>

      <div id="roomsPane" class="pane hidden">
        <div class="rooms-head">
          <span>현재 방</span>
          <button id="refreshRooms" class="ghost">새로고침</button>
        </div>
        <div id="roomList" class="room-list"></div>
      </div>

      <p id="lobbyError" class="error"></p>
    </div>
  </div>

  <!-- 대기실 -->
  <div id="waiting" class="screen hidden">
    <div class="lobby-card">
      <h2>대기실</h2>
      <p>방 코드: <span id="roomCode" class="code"></span> <button id="copyCode" class="ghost">복사</button></p>
      <p class="sub">친구들에게 이 코드를 공유하세요. (최대 9명)</p>
      <ul id="waitingPlayers" class="player-list"></ul>
      <div id="botControl" class="bot-control hidden">
        <span class="bot-label">🤖 테스트 봇</span>
        <button id="botMinus" class="step-btn">−</button>
        <span id="botCount">0</span>
        <button id="botPlus" class="step-btn">+</button>
      </div>
      <button id="startBtn" class="primary hidden">게임 시작</button>
      <p id="waitHint" class="sub"></p>
    </div>
  </div>

  <!-- 게임 테이블 -->
  <div id="game" class="screen hidden">
    <div class="topbar">
      <span class="badge" id="handBadge">핸드 #0</span>
      <span class="badge" id="blindBadge">블라인드 –</span>
      <span class="badge" id="levelBadge">레벨 1</span>
      <span class="badge" id="potBadge">팟 0</span>
      <button class="badge" id="muteBtn" title="소리 켜기/끄기" style="cursor:pointer">🔊</button>
      <button class="badge" id="settingsBtn" title="설정" style="cursor:pointer">⚙️</button>
    </div>

    <div class="table-wrap">
      <div class="poker-table">
        <div class="table-logo" aria-hidden="true">
          <svg viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
            <rect x="55" y="6" width="90" height="90" rx="20" fill="none" stroke="currentColor" stroke-width="5"/>
            <circle cx="80" cy="32" r="8" fill="currentColor"/>
            <circle cx="120" cy="32" r="8" fill="currentColor"/>
            <circle cx="100" cy="51" r="8" fill="currentColor"/>
            <circle cx="80" cy="70" r="8" fill="currentColor"/>
            <circle cx="120" cy="70" r="8" fill="currentColor"/>
            <text x="100" y="170" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="74" font-weight="800" fill="currentColor" letter-spacing="6">DICE</text>
          </svg>
        </div>
        <div class="community" id="community"></div>
        <div class="pot-stack" id="potStack"></div>
        <div class="pot-display" id="potDisplay"></div>
        <div id="seats"></div>
        <div class="winner-banner hidden" id="winnerBanner"></div>
      </div>
    </div>

    <div class="action-timer hidden" id="actionTimer"><div id="actionTimerFill"></div></div>
    <div class="actionbar" id="actionbar"></div>
    <div class="emoji-bar" id="emojiBar"></div>

    <div class="sidepanel">
      <div class="log" id="log"></div>
      <div class="chatbox">
        <div id="chatMessages" class="chat-messages"></div>
        <div class="chat-input">
          <input id="chatInput" maxlength="200" placeholder="메시지..." />
          <button id="chatSend" class="ghost">전송</button>
        </div>
      </div>
    </div>

    <div id="settingsPanel" class="overlay hidden">
      <div class="settings-card">
        <h3>설정</h3>
        <label class="toggle-row"><span>전체 소리</span><input type="checkbox" id="optMaster" checked /></label>
        <label class="toggle-row"><span>내 차례 알림음</span><input type="checkbox" id="optTurn" checked /></label>
        <label class="toggle-row"><span>효과음(카드·칩·승리)</span><input type="checkbox" id="optFx" checked /></label>
        <button id="settingsClose" class="primary">닫기</button>
      </div>
    </div>

    <div id="finalScreen" class="overlay hidden">
      <div id="confetti" class="confetti"></div>
      <div class="final-card">
        <div class="champ-trophy">🏆</div>
        <div class="champ-label">CHAMPION</div>
        <div id="champName" class="champ-name"></div>
        <div class="champ-sub">토너먼트 우승!</div>
        <ol id="finalRanks"></ol>
        <button onclick="location.reload()" class="primary">새 게임</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js?v=30"></script>
</body>
</html>
