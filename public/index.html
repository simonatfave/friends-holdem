<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🎲 Dice — 친구들과 포커</title>
  <link rel="stylesheet" href="style.css?v=5" />
</head>
<body>
  <!-- 로비 화면 -->
  <div id="lobby" class="screen">
    <div class="lobby-card">
      <div class="brand-logo">
        <svg viewBox="0 0 340 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DICE">
          <rect x="6" y="14" width="68" height="68" rx="16" fill="#e8c466"/>
          <circle cx="26" cy="34" r="6.5" fill="#14181f"/>
          <circle cx="54" cy="34" r="6.5" fill="#14181f"/>
          <circle cx="40" cy="48" r="6.5" fill="#14181f"/>
          <circle cx="26" cy="62" r="6.5" fill="#14181f"/>
          <circle cx="54" cy="62" r="6.5" fill="#14181f"/>
          <text x="92" y="67" font-family="-apple-system,Segoe UI,sans-serif" font-size="58" font-weight="800" fill="#e8c466" letter-spacing="3">DICE</text>
        </svg>
      </div>
      <p class="sub">친구들과 즐기는 실시간 텍사스 홀덤 · 토너먼트</p>

      <label>닉네임</label>
      <input id="nameInput" maxlength="16" placeholder="이름을 입력하세요" />

      <div class="tabs">
        <button class="tab active" data-tab="create">방 만들기</button>
        <button class="tab" data-tab="join">방 참여</button>
      </div>

      <div id="createPane" class="pane">
        <div class="row">
          <div>
            <label>시작 스택</label>
            <input id="startingChips" type="number" value="1500" min="500" step="100" />
          </div>
          <div>
            <label>레벨당 핸드 수</label>
            <input id="handsPerLevel" type="number" value="8" min="2" max="50" />
          </div>
        </div>
        <button id="createBtn" class="primary">방 만들기</button>
      </div>

      <div id="joinPane" class="pane hidden">
        <label>방 코드</label>
        <input id="codeInput" maxlength="4" placeholder="ABCD" style="text-transform:uppercase" />
        <button id="joinBtn" class="primary">참여하기</button>
      </div>

      <p id="lobbyError" class="error"></p>
    </div>
  </div>

  <!-- 대기실 -->
  <div id="waiting" class="screen hidden">
    <div class="lobby-card">
      <h2>대기실</h2>
      <p>방 코드: <span id="roomCode" class="code"></span> <button id="copyCode" class="ghost">복사</button></p>
      <p class="sub">친구들에게 이 코드를 공유하세요. (최대 9명)</p>
      <ul id="waitingPlayers" class="player-list"></ul>
      <button id="addBotBtn" class="ghost hidden" style="width:100%;margin-bottom:8px;padding:10px">🤖 테스트 봇 추가</button>
      <button id="startBtn" class="primary hidden">게임 시작</button>
      <p id="waitHint" class="sub"></p>
    </div>
  </div>

  <!-- 게임 테이블 -->
  <div id="game" class="screen hidden">
    <div class="topbar">
      <span class="badge" id="handBadge">핸드 #0</span>
      <span class="badge" id="blindBadge">블라인드 –</span>
      <span class="badge" id="levelBadge">레벨 1</span>
      <span class="badge" id="potBadge">팟 0</span>
      <button class="badge" id="muteBtn" title="소리 켜기/끄기" style="cursor:pointer">🔊</button>
    </div>

    <div class="table-wrap">
      <div class="poker-table">
        <div class="table-logo" aria-hidden="true">
          <svg viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
            <rect x="55" y="6" width="90" height="90" rx="20" fill="none" stroke="currentColor" stroke-width="5"/>
            <circle cx="80" cy="32" r="8" fill="currentColor"/>
            <circle cx="120" cy="32" r="8" fill="currentColor"/>
            <circle cx="100" cy="51" r="8" fill="currentColor"/>
            <circle cx="80" cy="70" r="8" fill="currentColor"/>
            <circle cx="120" cy="70" r="8" fill="currentColor"/>
            <text x="100" y="170" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="74" font-weight="800" fill="currentColor" letter-spacing="6">DICE</text>
          </svg>
        </div>
        <div class="community" id="community"></div>
        <div class="pot-display" id="potDisplay"></div>
        <div id="seats"></div>
        <div class="winner-banner hidden" id="winnerBanner"></div>
      </div>
    </div>

    <div class="actionbar" id="actionbar"></div>

    <div class="sidepanel">
      <div class="log" id="log"></div>
      <div class="chatbox">
        <div id="chatMessages" class="chat-messages"></div>
        <div class="chat-input">
          <input id="chatInput" maxlength="200" placeholder="메시지..." />
          <button id="chatSend" class="ghost">전송</button>
        </div>
      </div>
    </div>

    <div id="finalScreen" class="overlay hidden">
      <div class="final-card">
        <h2>🏆 토너먼트 종료</h2>
        <ol id="finalRanks"></ol>
        <button onclick="location.reload()" class="primary">새 게임</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js?v=5"></script>
</body>
</html>
